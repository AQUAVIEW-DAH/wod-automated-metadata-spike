[project]
name = "wod-etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "netcdf4>=1.7.4",
    # read_any's Excel engine: accessions often arrive as spreadsheets.
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    # extract_pdf_rows: some positions, dates and measurements exist only in PDF cruise reports.
    "pypdf>=6.16.1",
    "uvicorn>=0.54.0",
]

# uv run wod-etl web | run | confirm | status
[project.scripts]
wod-etl = "wod_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The package sits at the repo root.
[tool.setuptools.packages.find]
where = ["."]
include = ["wod_etl*"]

# The browser page `wod-etl web` serves.
[tool.setuptools.package-data]
"wod_etl.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
