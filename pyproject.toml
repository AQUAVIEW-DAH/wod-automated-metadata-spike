[project]
name = "wod-etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "netcdf4>=1.7.4",
    # Accessions arrive as spreadsheets often enough that read_any needs an Excel engine;
    # without one it can only tell you to export the sheet to CSV yourself.
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    # Cruise reports state station positions, dates and some measurements only in PDF
    # tables; wod_etl.staging.extract_pdf_rows reads them, with a page citation.
    "pypdf>=6.16.1",
    "uvicorn>=0.54.0",
]

# uv run wod-etl web | run | confirm | status
[project.scripts]
wod-etl = "wod_etl.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The package sits at the repo root, so it installs like any other Python project.
[tool.setuptools.packages.find]
where = ["."]
include = ["wod_etl*"]

# The browser page `wod-etl web` serves.
[tool.setuptools.package-data]
"wod_etl.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
